<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE AI Tutor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    .container {
      width: 100%;
      max-width: 760px;
      height: 92vh;
      background: rgba(20, 20, 30, 0.4);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.1);
    }

    .header-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00f2fe;
      box-shadow: 0 0 10px #00f2fe;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(0, 242, 254, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
    }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .header span {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-left: auto;
      background: rgba(255,255,255,0.05);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    
    .messages::-webkit-scrollbar {
      width: 6px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: slideIn 0.3s ease-out forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.agent {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.6;
      font-weight: 400;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #000;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .message.agent .bubble {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .message.agent.loading .bubble {
      color: #94a3b8;
      font-style: italic;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .timestamp {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
      padding: 0 4px;
    }

    .input-row {
      padding: 16px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: rgba(0,0,0,0.1);
    }

    textarea {
      flex: 1;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      font-size: 15px;
      font-family: inherit;
      color: #fff;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 48px;
      line-height: 1.5;
      transition: all 0.2s;
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }

    textarea:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
    }

    button.send-action {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    button.send-action:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
    }

    button.send-action:active:not(:disabled) {
      transform: translateY(0) scale(0.95);
    }

    button.send-action:disabled {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
      cursor: not-allowed;
    }

    button.send-action svg {
      width: 20px;
      height: 20px;
      fill: #000;
    }

    button.send-action:disabled svg {
      fill: rgba(255,255,255,0.4);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      gap: 16px;
    }

    .empty-state p {
      font-size: 16px;
      font-weight: 300;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
      padding: 0 20px;
    }

    .suggestion {
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      font-size: 13px;
      font-family: inherit;
      color: #e2e8f0;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
      backdrop-filter: blur(5px);
    }

    .suggestion:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: rgba(0, 242, 254, 0.4);
      color: #fff;
      transform: translateY(-1px);
    }
    .bubble > *:first-child { margin-top: 0; }
    .bubble > *:last-child { margin-bottom: 0; }
    .bubble p { margin: 0 0 10px; }
    .bubble strong { font-weight: 600; color: #fff; }
    .bubble em { font-style: italic; }
    .bubble ul, .bubble ol { margin: 8px 0 10px; padding-left: 22px; }
    .bubble li { margin: 4px 0; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      font-size: 15px; font-weight: 600; color: #fff; margin: 14px 0 8px;
    }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; padding: 2px 6px; border-radius: 6px;
      background: rgba(0, 242, 254, 0.12); color: #7fe7ff;
    }
    .bubble pre {
      background: rgba(0, 0, 0, 0.35); padding: 12px 14px; border-radius: 12px;
      overflow-x: auto; margin: 10px 0;
    }
    .bubble pre code { background: none; padding: 0; color: #cbd5e1; }
    .bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 12px 0; }
    .bubble table { border-collapse: collapse; margin: 10px 0; font-size: 14px; }
    .bubble th, .bubble td { border: 1px solid rgba(255,255,255,0.14); padding: 6px 10px; }
    .bubble .katex { font-size: 1.02em; }
    .bubble .katex-display {
      margin: 12px 0; padding: 4px 0;
      overflow-x: auto; overflow-y: hidden;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-dot"></div>
    <h1>JEE AI Tutor</h1>
    <span id="session-label">session: default</span>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <p>Ask me anything from your JEE notes...</p>
      <div class="suggestions">
        <!-- Using backticks to avoid syntax errors with single quotes inside JS strings -->
        <button class="suggestion" onclick="fillInput(`What is Newton's second law?`)">Newton's second law</button>
        <button class="suggestion" onclick="fillInput(`Calculate KE for 10kg at 5 m/s`)">Calculate KE</button>
        <button class="suggestion" onclick="fillInput(`What is Coulomb's law?`)">Coulomb's law</button>
        <button class="suggestion" onclick="fillInput(`Explain the work-energy theorem`)">Work-energy theorem</button>
      </div>
    </div>
  </div>

  <div class="input-row">
    <textarea
      id="input"
      placeholder="Type a physics, chemistry, or math question..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" class="send-action" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
  const API_URL = "/chat";
  const sessionId = "session_" + Math.random().toString(36).substr(2, 9);
  document.getElementById("session-label").textContent = "session: " + sessionId.substr(8);

  function autoResize(el) {
    el.style.height = "48px";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function fillInput(text) {
    document.getElementById("input").value = text;
    document.getElementById("input").focus();
  }

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderAnswer(text) {
    const math = [];
    const stash = (tex, display) => {
      math.push({ tex, display });
      return `@@MATH${math.length - 1}@@`;
    };

    let s = text
      .replace(/\\\[([\s\S]+?)\\\]/g, (m, tex) => stash(tex, true))
      .replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => stash(tex, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (m, tex) => stash(tex, false));

    let html = marked.parse(s, { breaks: true, gfm: true });

    html = html.replace(/@@MATH(\d+)@@/g, (m, i) => {
      const { tex, display } = math[Number(i)];
      try {
        return katex.renderToString(tex, { displayMode: display, throwOnError: false });
      } catch (e) {
        return `<code>${tex}</code>`;
      }
    });

    return html;
  }

  function addMessage(role, text, isLoading = false) {
    const empty = document.getElementById("empty-state");
    if (empty) empty.remove();

    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `message ${role}${isLoading ? " loading" : ""}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "agent" && !isLoading) {
      bubble.innerHTML = renderAnswer(text);
    } else {
      bubble.textContent = text;
    }

    const stamp = document.createElement("div");
    stamp.className = "timestamp";
    stamp.textContent = getTime();

    div.appendChild(bubble);
    div.appendChild(stamp);

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById("input");
    const btn = document.getElementById("send-btn");
    const question = input.value.trim();

    if (!question) return;

    input.value = "";
    input.style.height = "48px";
    btn.disabled = true;

    addMessage("user", question);

    const loadingMsg = addMessage("agent", "Thinking...", true);

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, session_id: sessionId })
        });

        const data = await response.json();
        loadingMsg.remove();

        if (!response.ok) {
            addMessage("agent", data.error || "Something went wrong. Please try again.");
        } else {
            addMessage("agent", data.answer);
        }

    } catch (error) {
        loadingMsg.remove();
        addMessage("agent", "Cannot reach the server. Make sure it is running.");
    }

    btn.disabled = false;
    input.focus();
  }
</script>

</body>
</html>
